server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

  ai:
    ollama:
      base-url: ${OLLAMA_URL}
      embedding:
        model: ${EMBEDDING_MODEL}
      chat:
        model: ${LLM_MODEL}
        options:
          num-predict: 512

  vectorstore:
    pgvector:
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      similarity-threshold: 0.5
      dimensions: 768
      initialize-schema: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE_MB}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB}MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

app:
  docs-directory: ${DOCS_DIRECTORY}
  retrieval-k: ${RETRIEVAL_K}
  chunk-size-words: ${CHUNK_SIZE_WORDS}
  chunk-overlap-words: ${CHUNK_OVERLAP_WORDS}
  max-prompt-chars: ${MAX_PROMPT_CHARS}
  upload-write-chunk-bytes: ${UPLOAD_WRITE_CHUNK_BYTES}
  upload-max-concurrency: ${UPLOAD_MAX_CONCURRENCY}
  chat-max-concurrency: ${CHAT_MAX_CONCURRENCY}
  admission-wait-seconds: ${ADMISSION_WAIT_SECONDS}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    org.springframework.ai: INFO
    com.finassistmini: DEBUG

repository:
  storage-path: ${REPOSITORY_STORAGE_PATH}
  max-file-size-bytes: 1048576
  max-files-per-repo: 2000
  max-depth: 20
  clone-timeout-seconds: 120
  summary-enabled: true
  async-enabled: true
  allowed-extensions:
    - java
    - kt
    - py
    - js
    - ts
    - go
    - rs
    - c
    - cpp
    - cs
    - yaml
    - yml
    - json
    - xml
    - md
    - properties
    - sql
    - gradle
    - kts
    - dockerfile
    - txt
  ignored-directories:
    - .git
    - node_modules
    - target
    - build
    - dist
    - coverage
    - .idea
    - .vscode
    - bin
    - obj
    - vendor
    - logs
    - tmp
    - generated
    - __pycache__
    - .gradle
    - .mvn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never